name: Build and release

on:
  schedule:
    - cron: '17 */6 * * *'
  # A changed patch set (e.g. a merged repair PR) builds the latest tag right away.
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'patches.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream WooCommerce tag to build (default: latest stable)'
        required: false
        type: string
      force:
        description: 'Rebuild even if a release exists for this tag and patch set'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and test, but do not publish a release'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  NODE_VERSION: '24.15.0'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  keepalive:
    name: Keep schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # GitHub disables scheduled workflows after 60 days without repository activity.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build-release.yml/enable"

  resolve:
    name: Resolve tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      is_latest: ${{ steps.resolve.outputs.is_latest }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
        run: bin/resolve-release.sh "$INPUT_TAG" "$INPUT_FORCE" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build and test ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply patches and build
        run: bin/build.sh "$TAG"

      - name: Unit tests
        run: bin/test.sh "$TAG"

      - name: Smoke test
        run: bin/smoke-test.sh "$TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/${{ env.TAG }}/
          retention-days: 3
          if-no-files-found: error

      - name: Upload patch report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-report
          path: .work/${{ env.TAG }}.report.json
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish ${{ needs.resolve.outputs.release_tag }}
    needs: [resolve, build]
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      BUILD: ${{ needs.resolve.outputs.build }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Write release notes
        run: |
          {
            echo "WooCommerce $TAG with the 86inc patch set. \`Version:\` is unchanged; the build is identified by its stamp."
            echo
            echo "Build: $BUILD"
            echo "SHA-256: \`$(cut -d' ' -f1 dist/woocommerce.zip.sha256)\`"
            echo
            echo "| Patch | Status |"
            echo "| ----- | ------ |"
            jq -r '.patches[] | "| \(.id) | \(.status) |"' dist/build-manifest.json
            echo
            echo "Built by [this run]($RUN_URL)."
          } > notes.md

      - name: Create release
        run: |
          gh release create "$RELEASE_TAG" \
            dist/woocommerce.zip dist/woocommerce.zip.sha256 dist/build-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WooCommerce $TAG (86inc build ${RELEASE_TAG##*-build.})" \
            --notes-file notes.md \
            --latest="$IS_LATEST"

      - name: Close build failure issue
        run: |
          title="Build failed: WooCommerce $TAG"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --search "\"$title\" in:title" --json number,title \
            | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' \
            | while read -r number; do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Published [$RELEASE_TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)."
            done

  repair:
    name: Repair
    needs: [resolve, build]
    if: failure() && needs.build.result == 'failure'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/repair.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  report-failure:
    name: Report failure
    needs: [resolve, build, release]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      BUILD: ${{ needs.resolve.outputs.build }}
      MAINTAINER: ${{ vars.MAINTAINER || 'jbouganim' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update issue
        run: |
          title="Build failed: WooCommerce ${TAG:-unknown tag}"
          marker="<!-- build-failed: ${BUILD:-unknown} -->"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --search "\"$title\" in:title" --json number,title \
            | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1)"
          body="The build for \`${TAG:-unknown tag}\` failed, so no release was published and client sites stay on their current build. See [the run]($RUN_URL). When the build or tests failed, an automatic repair runs next and posts its result here.

          $marker"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee "$MAINTAINER"
          elif { gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            gh api "repos/$GITHUB_REPOSITORY/issues/$existing/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body'
          } | grep -qF "$marker"; then
            # Already reported for this tag and patch set; stay quiet until something changes.
            echo "Failure for $BUILD already reported on #$existing"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
