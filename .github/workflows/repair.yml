name: Repair patches

# Runs when a build fails (called from build-release.yml) or by hand. Claude Code
# fixes the patches in a read-only job; a separate job without AI re-verifies the
# result from a clean checkout and opens a PR. Nothing is merged or released here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream WooCommerce tag whose build failed'
        required: true
        type: string
      force:
        description: 'Run even if this tag and patch set was already attempted'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

concurrency:
  group: repair-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.15.0'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  TAG: ${{ inputs.tag }}

jobs:
  gate:
    name: Check for earlier attempts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      build: ${{ steps.gate.outputs.build }}
      branch: ${{ steps.gate.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ -z "$TAG" ] || [ -n "$(tr -d '0-9A-Za-z.-' <<<"$TAG")" ]; then
            echo "Invalid tag: '$TAG'" >&2
            exit 1
          fi
          build="$TAG+$(bin/patch-set-hash.sh)"
          branch="repair/$TAG-${build#*+}"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          run=true
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set, so no repair was attempted."
            run=false
          elif [ "$FORCE" != "true" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --silent 2>/dev/null; then
              echo "A repair branch already exists for $build: $branch"
              run=false
            elif { gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --jq '.[].body // ""'
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues/comments?per_page=100" --jq '.[].body // ""'
            } | grep -qF "<!-- repair-attempted: $build -->"; then
              echo "A repair was already attempted for $build. Dispatch with force to retry."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  repair:
    name: Diagnose and repair ${{ inputs.tag }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      # Not .work/: that path is gitignored, and the agent's search tools skip ignored files.
      WORK_DIR: ${{ github.workspace }}/work
    outputs:
      mode: ${{ steps.diagnose.outputs.mode }}
      result: ${{ steps.collect.outputs.result }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Diagnose
        id: diagnose
        run: bin/diagnose.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Repair with Claude Code
        id: claude
        if: steps.diagnose.outputs.mode != 'none' && steps.diagnose.outputs.mode != 'setup'
        continue-on-error: true
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        env:
          # Builds and wp-env test runs take several minutes each.
          BASH_DEFAULT_TIMEOUT_MS: '1800000'
          BASH_MAX_TIMEOUT_MS: '3600000'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: Read ${{ env.WORK_DIR }}/repair/TASK.md and follow it.
          claude_args: >-
            --model opus
            --max-turns 150
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(bin/build.sh:*),Bash(bin/test.sh:*),Bash(bin/smoke-test.sh:*),Bash(bin/save-resolution.sh:*),Bash(bin/work-git.sh:*),Bash(tail:*),Bash(grep:*)"
            --disallowedTools "WebFetch,WebSearch,Task"

      - name: Collect result
        id: collect
        if: always() && steps.claude.outcome != 'skipped' && steps.diagnose.outcome == 'success'
        run: |
          out="$RUNNER_TEMP/repair"
          mkdir -p "$out/patches"
          cp patches.json "$out/"
          cp patches/*.patch "$out/patches/"
          cp "$WORK_DIR/repair/failure.log" "$out/" 2>/dev/null || true
          if [ -f "$WORK_DIR/repair/SUMMARY.md" ]; then
            cp "$WORK_DIR/repair/SUMMARY.md" "$out/"
          else
            printf 'RESULT: gave-up\n\nClaude Code did not write a summary (it may have hit a usage or turn limit).\n' > "$out/SUMMARY.md"
          fi
          if [ "$(head -1 "$out/SUMMARY.md")" = "RESULT: fixed" ]; then
            echo "result=fixed" >> "$GITHUB_OUTPUT"
          else
            echo "result=gave-up" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.collect.outcome == 'success'
        with:
          name: repair
          path: ${{ runner.temp }}/repair/
          retention-days: 14
          if-no-files-found: error

  verify:
    name: Verify repair from a clean checkout
    needs: repair
    if: needs.repair.outputs.result == 'fixed'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repair
          path: ${{ runner.temp }}/repair

      - name: Check and install repaired patches
        run: bin/verify-repair.sh "$RUNNER_TEMP/repair"

      - name: Apply patches and build
        run: bin/build.sh "$TAG"

      - name: Unit tests
        run: bin/test.sh "$TAG"

      - name: Smoke test
        run: bin/smoke-test.sh "$TAG"

  open-pr:
    name: Open PR
    needs: [gate, repair, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.pr.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.gate.outputs.branch }}
      BASE: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repair
          path: ${{ runner.temp }}/repair

      - name: Commit, push, and open PR
        id: pr
        run: |
          changed="$(bin/verify-repair.sh "$RUNNER_TEMP/repair")"
          git switch -c "$BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -am "Refresh patches for WooCommerce $TAG"
          git push --quiet origin "$BRANCH"
          {
            echo "Claude Code repaired the patch set for WooCommerce \`$TAG\`. A separate job then re-checked it from a clean checkout: every patch applies, and the build, Jest, PHPUnit, and smoke test pass. See [the run]($RUN_URL)."
            echo
            echo "Changed patches:"
            while read -r id; do echo "- \`$id\`"; done <<<"$changed"
            echo
            echo "Merging this lets the next scheduled run publish a release for \`$TAG\`."
            echo
            echo "## Agent summary"
            echo
            tail -n +2 "$RUNNER_TEMP/repair/SUMMARY.md"
          } > body.md
          url="$(gh pr create --base "$BASE" --head "$BRANCH" --title "Refresh patches for WooCommerce $TAG" --body-file body.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  report:
    name: Report outcome
    needs: [gate, repair, verify, open-pr]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD: ${{ needs.gate.outputs.build }}
      REPAIR_JOB: ${{ needs.repair.result }}
      MODE: ${{ needs.repair.outputs.mode }}
      RESULT: ${{ needs.repair.outputs.result }}
      VERIFY_JOB: ${{ needs.verify.result }}
      PR_URL: ${{ needs.open-pr.outputs.url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.repair.outputs.result != ''
        continue-on-error: true
        with:
          name: repair
          path: repair

      - name: Comment on the build failure issue
        run: |
          if [ -n "$PR_URL" ]; then
            outcome="Claude Code repaired the patches and the fix passed verification: $PR_URL. Merge it to release \`$TAG\`."
          elif [ "$MODE" = "none" ]; then
            outcome="The build passed when rerun, so nothing needed repair. The next scheduled run will publish it."
          elif [ "$MODE" = "setup" ]; then
            outcome="The build environment failed before any patch code ran, so Claude Code was not started."
          elif [ "$RESULT" = "fixed" ] && [ "$VERIFY_JOB" = "failure" ]; then
            outcome="Claude Code reported a fix, but it failed verification from a clean checkout, so no PR was opened."
          elif [ "$RESULT" = "gave-up" ]; then
            outcome="Claude Code could not repair the patches. The release stays held until they're refreshed by hand."
          else
            outcome="The repair run did not finish (repair job: $REPAIR_JOB)."
          fi

          {
            echo "**Automatic repair for \`$BUILD\`:** $outcome See [the run]($RUN_URL)."
            if [ -z "$PR_URL" ] && [ -f repair/SUMMARY.md ]; then
              echo
              echo "<details><summary>Agent notes</summary>"
              echo
              tail -n +2 repair/SUMMARY.md
              echo
              echo "</details>"
            fi
            echo
            echo "<!-- repair-attempted: $BUILD -->"
          } > comment.md

          title="Build failed: WooCommerce $TAG"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file comment.md
          fi
